name: Release

# Push a tag such as v1.2.0 to build, test and publish a GitHub release with the installer.
# Running it by hand (Actions → Release → Run workflow) produces the same files as an artifact, without a release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Signing and notarization switch on by themselves once these secrets exist (see README).
      HAS_SIGNING: ${{ secrets.MACOS_APPLICATION_P12 != '' && secrets.MACOS_INSTALLER_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Choose version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.$GITHUB_RUN_NUMBER"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCLICKMAKER_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"

          for P12 in application installer; do
            security import "$RUNNER_TEMP/$P12.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm "$RUNNER_TEMP/$P12.p12"
          done

          # Lets codesign use the keys without a UI prompt, then puts the keychain on the search list.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          if [[ "$HAS_SIGNING" == "true" ]]; then
            export SIGN_APPLICATION="Developer ID Application"
            export SIGN_INSTALLER="Developer ID Installer"

            # Apple only notarizes Developer ID signed code.
            if [[ "$HAS_NOTARY" == "true" ]]; then
              export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
              printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY_PATH"
            fi
          fi

          scripts/package-macos.sh "$VERSION"

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: ClickMaker-${{ steps.version.outputs.version }}
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "## 설치"
            echo "1. \`ClickMaker-$VERSION-macOS.pkg\`를 열어 설치합니다. 플러그인은 \`/Library/Audio/Plug-Ins/Components\`에 들어갑니다."
            echo "2. Logic을 다시 열면 AU Instruments → ClickMaker에 나타납니다."
            echo ""
            echo "zip은 수동 설치용입니다. 압축을 풀어 \`ClickMaker.component\`를 \`~/Library/Audio/Plug-Ins/Components\`에 넣으세요."

            if [[ "$HAS_SIGNING" != "true" || "$HAS_NOTARY" != "true" ]]; then
              echo ""
              echo "이 빌드는 Apple 공증을 받지 않았습니다. 설치 프로그램이 막히면 Finder에서 우클릭 → 열기를 쓰거나, 시스템 설정 → 개인정보 보호 및 보안에서 '그래도 열기'를 누르세요."
              echo "zip으로 설치했다면 한 번 실행하세요: \`xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/ClickMaker.component\`"
            fi

            echo ""
            echo "요구 사항: macOS 14 이상 (Apple Silicon, Intel)"
          } > "$NOTES"

          gh release create "$GITHUB_REF_NAME" dist/* --title "ClickMaker $VERSION" --notes-file "$NOTES" --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
